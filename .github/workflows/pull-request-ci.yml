name: Pull Request CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pull-request-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect mobile changes
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.paths.outputs.android }}
      ios: ${{ steps.paths.outputs.ios }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect affected platforms
        id: paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            android \
            .github/workflows/android-ci.yml \
            .github/workflows/pull-request-ci.yml
          then
            echo "android=false" >> "$GITHUB_OUTPUT"
          else
            echo "android=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            ios \
            .github/workflows/ios-ci.yml \
            .github/workflows/pull-request-ci.yml
          then
            echo "ios=false" >> "$GITHUB_OUTPUT"
          else
            echo "ios=true" >> "$GITHUB_OUTPUT"
          fi

  android:
    name: Android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    uses: ./.github/workflows/android-ci.yml

  ios:
    name: iOS
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    uses: ./.github/workflows/ios-ci.yml

  required-ci:
    name: Required CI
    needs:
      - changes
      - android
      - ios
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Verify required jobs
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          IOS_RESULT: ${{ needs.ios.result }}
        run: |
          set -euo pipefail

          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change detection failed: $CHANGES_RESULT"
            exit 1
          fi

          for result in "$ANDROID_RESULT" "$IOS_RESULT"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "A required platform workflow failed: $result"
              exit 1
            fi
          done

          echo "All required platform checks passed."
